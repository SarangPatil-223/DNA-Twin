server {
  listen 3000;
  root /usr/share/nginx/html;
  client_max_body_size 5m;

  # API calls go to FastAPI; long timeouts because benchmarks can run for minutes
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
  }

  # single-page app: every other path serves index.html so React Router can handle it
  location / {
    try_files $uri /index.html;
  }
}
