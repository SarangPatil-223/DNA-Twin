# DNA Twin — simulation only. `docker compose up --build`, then open http://localhost:3000
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dnatwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnatwin}
      POSTGRES_DB: ${POSTGRES_DB:-dnatwin}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dnatwin}"]
      interval: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrant:/qdrant/storage]
    ports: ["6333:6333"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dnatwin}:${POSTGRES_PASSWORD:-dnatwin}@postgres:5432/${POSTGRES_DB:-dnatwin}
      QDRANT_URL: http://qdrant:6333
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-auto}
      CORS_ORIGINS: http://localhost:3000
    volumes: [backend_data:/srv/data]
    extra_hosts: ["host.docker.internal:host-gateway"]  # lets the backend reach Ollama on the host (Linux)
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend   # React (Vite) build served by nginx, which forwards /api to the backend
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  pgdata:
  qdrant:
  backend_data:
